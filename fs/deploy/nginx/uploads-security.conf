# Include this inside the FSEG server block before the PHP location.
# It serves uploaded files as static assets and refuses executable scripts.

location ~* ^/uploads/.*\.(?:php|phtml|php[0-9]?|phar|cgi|pl|py|sh|asp|aspx|jsp)$ {
    return 404;
}

location ^~ /uploads/ {
    autoindex off;
    try_files $uri =404;
}
